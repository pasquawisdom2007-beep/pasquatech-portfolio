# Render Blueprint — deploys PASQUA DEV as a free static site.
# Dashboard alternative: New → Static Site, Build Command `npm install && npm run build`,
# Publish Directory `dist`, then add a Rewrite rule  /*  →  /index.html
services:
  - type: web
    name: pasqua-dev-portfolio
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
